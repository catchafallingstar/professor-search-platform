name: Jac compile validation

on:
  push:
    branches:
      - chatgpt/staff-signin-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jac-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install current Jac toolchain
        run: |
          curl -fsSL https://raw.githubusercontent.com/jaseci-labs/jaseci/main/scripts/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check Jac version
        run: jac --version
      - name: Install dependencies
        run: jac install
      - name: Test account identity lookup (no database credentials)
        run: |
          python3 -m unittest discover -s tests -p "test_*.py" -v
          python3 -m pip install -q pytest
          python3 -m pytest -q tests/test_faculty_identity_signals.py tests/test_name_utils.py
      - name: Compile and type-check all Jac apps
        run: jac check
      - name: Test Jac owner and staff authorization logic
        run: jac run tests/test_staff_access.jac
      - name: Test real Jac identity lookup (configured backend)
        run: jac run tests/test_jac_identity_backend.jac